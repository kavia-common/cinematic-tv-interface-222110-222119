# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# CI/Docker friendly Gradle settings (stabilized)
# Disable daemon for isolated CI builds; resolves JVM daemon mismatch warnings
org.gradle.daemon=false
org.gradle.parallel=false
# Explicitly disable configuration on demand to avoid incubating feature warnings
org.gradle.configureondemand=false
# Disable configuration cache to avoid flakiness in experimental DCL setup
org.gradle.configuration-cache=false
# JVM settings: increased heap/metaspace and Parallel GC for Kotlin IR stability
org.gradle.jvmargs=-Xmx3072m -Xms512m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Reduce deprecation output noise in CI
org.gradle.warning.mode=summary

# Kotlin incremental compilation stability
kotlin.incremental=true
