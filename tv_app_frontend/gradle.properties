# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# CI/Docker friendly Gradle settings (stabilized)
org.gradle.daemon=false
org.gradle.parallel=false
# Removed deprecated/unstable flags for CI
# org.gradle.configureondemand is deprecated and removed in recent Gradle
# Disable configuration cache to avoid flakiness in experimental DCL setup
org.gradle.configuration-cache=false
# Constrain memory to avoid OOM and IR failures in Docker
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Kotlin incremental compilation stability
kotlin.incremental=true
